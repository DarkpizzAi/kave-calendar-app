<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <!-- Content-Security-Policy. The GitHub token sits in localStorage in plain
       text - see the README - so anything that can run script on this origin
       can read it and write to the hub repo. This is the backstop for that:
       `script-src 'self'` plus one hash, no 'unsafe-inline' and no
       'unsafe-eval', so injected script does not run even if something one
       day reaches the DOM unescaped.

       It has to be a meta tag: GitHub Pages serves static files and cannot
       set headers. That costs three directives a meta CSP ignores outright -
       frame-ancestors, report-uri and sandbox - so they are deliberately
       absent rather than written down doing nothing. Clickjacking is
       consequently NOT covered here.

       THE HASH BELOW COVERS #theme-preload IN THIS FILE, BYTE FOR BYTE.
       Edit that script, even one character of whitespace, and it stops
       matching and is silently blocked. It says so rather than only flashing
       the wrong colours: the script stamps data-theme-boot on <html>, and
       Settings shows a red "Theme preload BLOCKED" line when that stamp is
       missing. The recompute command lives in the README, deliberately not
       here: a command containing the text <script></script> is itself what a
       regex hunting for the script would match first.

       .gitattributes pins eol=lf, so the bytes hashed locally are the bytes
       Pages serves; a CRLF working tree hashes to something production
       rejects.

       style-src keeps 'unsafe-inline' because the app writes style="..."
       attributes at runtime (the palette swatches in Settings). The narrower
       style-src-attr/-elem pair says that precisely where the browser
       understands it: attributes yes, injected <style> elements no. -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    base-uri 'none';
    object-src 'none';
    form-action 'none';
    script-src 'self' 'sha256-otBnb0OxQNfkQPgRGhBbgYfnItUF6YEQrusVUD1eCdk=';
    style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
    style-src-elem 'self' https://fonts.googleapis.com;
    style-src-attr 'unsafe-inline';
    font-src https://fonts.gstatic.com;
    img-src 'self' data: blob:;
    connect-src 'self' https://api.github.com;
    manifest-src 'self';
    worker-src 'self'" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <!-- No theme-color meta on purpose: an installed app ignores it (measured
       on Spoon), and a hardcoded pair would be wrong for five of the six
       palettes anywhere it is honoured. The phone paints its bars from its
       own light/dark setting, and that is the whole story. -->
  <meta name="color-scheme" content="light dark" />
  <script id="theme-preload">
  /* Apply the saved palette before the first frame. Without this the document
     paints on the default blue seed until the module graph has loaded, so
     any other palette arrives as a visible flash of the wrong colours. A
     module is deferred and therefore always too late; this has to be inline. */
  (function () {
    var root = document.documentElement;
    /* Proof this script ran, read back by themeBootRan(). Set first, before
       anything that can throw, so a blocked localStorage does not read as a
       stale CSP hash. */
    root.dataset.themeBoot = "1";
    try {
      var s = JSON.parse(localStorage.getItem("compass.settings")) || {};
      /* same list as PALETTES in js/theme.js; the three pre-Material 3 names
         map across (cobalt and chartreuse to blue, amber to yellow) and
         anything else is blue */
      var map = { cobalt: "blue", amber: "yellow", chartreuse: "blue",
                  blue: "blue", teal: "teal", yellow: "yellow",
                  periwinkle: "periwinkle", terracotta: "terracotta" };
      root.setAttribute("data-seed", map[s.palette] || "blue");
      root.style.colorScheme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    } catch (e) { /* first run, or storage blocked */ }
  })();
  </script>
  <title>Kave Compass</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@300..700&display=swap" rel="stylesheet" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,300..700&display=swap" rel="stylesheet" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block" rel="stylesheet" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Color+Emoji&display=swap" rel="stylesheet" crossorigin />
  <!-- m3/ is GENERATED by brand/tools/sync-household-tokens.py in kave-hub.
       Never hand-edit it: edit the hub and re-sync. The kit loads before
       styles.css, which defines no colour of its own. tokens.css is still
       synced but no longer linked. -->
  <link rel="stylesheet" href="m3/kave-m3-tokens.css" />
  <link rel="stylesheet" href="m3/kave-m3.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="shell">
    <!-- Medium and expanded: the rail, menu button first, then New event, then
         the destinations. Which of rail and bar shows follows <html data-size>. -->
    <nav class="m3-rail app-rail" aria-label="Sections">
      <button type="button" id="railMenuBtn" class="m3-icon-btn" aria-label="Menu"><span class="m3-icon" aria-hidden="true">menu</span></button>
      <button type="button" id="railAdd" class="m3-fab" aria-label="New event"><span class="m3-icon" aria-hidden="true">add</span></button>
      <div class="m3-rail__items" id="railItems"></div>
    </nav>
    <div class="app-col">
      <header class="m3-top-bar m3-top-bar--center app-header" id="topBar">
        <button type="button" id="menuBtn" class="m3-icon-btn app-menu-btn" aria-label="Menu"><span class="m3-icon" aria-hidden="true">menu</span></button>
        <h1 id="tabName" class="m3-top-bar__title m3-title-l">Calendar</h1>
        <button type="button" id="searchBtn" class="m3-icon-btn" aria-label="Search"><span class="m3-icon" aria-hidden="true">search</span></button>
        <div id="syncBar" class="m3-progress-linear sync-bar" role="progressbar" aria-label="Syncing" hidden><i></i></div>
      </header>
      <main id="view" class="mn"></main>
      <nav class="m3-nav-bar app-nav-bar" id="nav" aria-label="Sections"></nav>
    </div>
    <button type="button" id="fab" class="m3-fab m3-fab--float app-fab" aria-label="New event"><span class="m3-icon" aria-hidden="true">add</span></button>
    <div id="archiveRoot"></div>
  </div>
  <!-- The sheet system (sheet.js): outside .shell, so the shell can be inert
       while a sheet, a form, a menu or a picker is open. -->
  <div id="sheetRoot"></div>

  <!-- Menu drawer: modal, holds Settings and Roadmap. The scrim must stay the
       drawer's previous sibling (enterLayer animates it with the drawer). -->
  <div id="drawerScrim" class="m3-scrim" hidden></div>
  <nav id="drawer" class="m3-drawer" role="dialog" aria-modal="true" aria-label="Menu" hidden>
    <div class="m3-drawer__head">
      <span class="m3-app-mark"><span class="m3-icon m3-icon--fill" aria-hidden="true">calendar_month</span></span>
      <span class="m3-title-l">Kave Compass</span>
    </div>
    <button type="button" class="m3-drawer__item" data-page="settings"><span class="m3-icon" aria-hidden="true">settings</span><span class="m3-drawer__label">Settings</span></button>
    <button type="button" class="m3-drawer__item" data-page="roadmap"><span class="m3-icon" aria-hidden="true">route</span><span class="m3-drawer__label">Roadmap</span></button>
  </nav>
  <!-- Pages (Settings, Roadmap and what Settings opens): full screen, back
       arrow, one history entry each -->
  <div id="page" class="m3-page" role="dialog" aria-modal="true" aria-labelledby="pageTitle" hidden>
    <header class="m3-top-bar m3-top-bar--center">
      <button type="button" id="pageBack" class="m3-icon-btn" aria-label="Back"><span class="m3-icon" aria-hidden="true">arrow_back</span></button>
      <h1 id="pageTitle" class="m3-top-bar__title m3-title-l"></h1>
      <span class="app-spacer"></span>
    </header>
    <div class="m3-sheet__body page-body" id="pageBody"></div>
  </div>

  <!-- Whole-app search: a full-screen page, one history entry (js/search.js) -->
  <div id="searchPage" class="m3-search-view" role="dialog" aria-modal="true" aria-label="Search Kave Compass" hidden>
    <div class="m3-search-view__bar">
      <button type="button" id="searchBack" class="m3-icon-btn" aria-label="Back"><span class="m3-icon" aria-hidden="true">arrow_back</span></button>
      <input id="searchInput" class="m3-search-view__input" type="text" placeholder="Search Kave Compass" autocomplete="off"
             autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="search" aria-label="Search Kave Compass" />
      <button type="button" id="searchClear" class="m3-icon-btn" aria-label="Clear" hidden><span class="m3-icon" aria-hidden="true">close</span></button>
    </div>
    <div id="searchResults" class="m3-search-view__body"></div>
  </div>

  <!-- the one snackbar host: sync status, Undo, and the sticky update line -->
  <div id="snackHost"></div>

  <script type="module" src="js/boot.js"></script>
</body>
</html>
